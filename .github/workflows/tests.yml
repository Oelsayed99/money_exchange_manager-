name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 and 8.4 both run because config/database.php branches on
        # PHP_VERSION_ID >= 80400 for the Pdo\Mysql::ATTR_SSL_CA constant.
        # A single-version matrix would leave one branch of that shim untested.
        php: ['8.3', '8.4']

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: finance_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: finance_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node Dependencies
        run: npm ci

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      # Tests run against MySQL, never SQLite. SQLite's type affinity does not
      # enforce DECIMAL precision or InnoDB constraints, which would hide exactly
      # the class of financial bug this suite exists to catch. See docs/ASSESSMENT.md §11.
      - name: Backend Tests (Pest, MySQL)
        run: ./vendor/bin/pest

      - name: Static Analysis (PHPStan level 8)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Code Style (Pint)
        run: ./vendor/bin/pint --test

      - name: Type Check (TypeScript strict)
        run: npm run types

      - name: Frontend Tests (Vitest)
        run: npm run test
